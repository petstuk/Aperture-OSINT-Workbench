<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperture</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="aperture.css">
  <style>
    body.aperture {
      width: 320px;
      overflow-x: hidden;
      background: var(--top-bar);
    }
    .popup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--divider);
    }
    .popup-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .local-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .local-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--benign);
      box-shadow: 0 0 8px var(--benign);
    }
    .popup-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .launch-hint {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .section-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: 600;
      margin: 8px 0 2px;
    }
    .tab-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      font-size: 12px;
      color: var(--text-2);
      border-bottom: 1px solid var(--divider-faint);
    }
    .tab-row:last-child { border-bottom: none; }
    .tab-host {
      flex: 1;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-note {
      font-size: 10.5px;
      color: var(--text-dim);
    }
    .toggle {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: var(--border-2);
      border: none;
      position: relative;
      transition: 0.15s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      transition: 0.15s;
    }
    .toggle.on::after { left: 19px; }
  </style>
</head>
<body class="aperture">
  <div class="popup-head">
    <div class="popup-brand">
      <img class="ap-brand-icon" src="icons/icon128.png" width="22" height="22" alt="">
      <div class="ap-wordmark">
        <span class="ap-wordmark-title">APERTURE</span>
        <span class="ap-wordmark-sub">osint workbench</span>
      </div>
    </div>
    <span class="local-chip"><span class="dot"></span>Local</span>
  </div>

  <div class="popup-body">
    <button type="button" class="ap-btn ap-btn-primary" id="btn-workbench" style="width:100%">Open full workbench ↗</button>
    <div class="launch-hint">Triage, cases, playbooks, packs and settings all live in the workbench.</div>

    <div class="section-label">This tab</div>
    <div class="tab-row">
      <span>On-page IoC detect</span>
      <button type="button" class="toggle" id="overlay-toggle" aria-label="Toggle on-page detection"></button>
    </div>
    <div class="tab-row">
      <span class="tab-host" id="site-host">No site host</span>
      <button type="button" class="ap-btn ap-btn-secondary ap-btn-sm" id="btn-site-toggle" disabled>Disable</button>
    </div>
    <div class="tab-note" id="site-note"></div>
  </div>

  <script src="ioc-utils.js"></script>
  <script src="palette.js"></script>
  <script src="popup.js"></script>
</body>
</html>
