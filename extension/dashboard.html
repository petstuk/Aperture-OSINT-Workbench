<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperture — OSINT Workbench</title>
  <link rel="icon" href="icons/icon32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon128.png" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="aperture.css">
  <style>
    html, body { height: 100%; }
    body.aperture {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 18px;
      border-bottom: 1px solid var(--divider);
      background: var(--top-bar);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cmd-trigger {
      flex: 1;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 32px;
      padding: 0 12px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      color: var(--text-dim);
      font-size: 12.5px;
      transition: 0.15s;
    }
    .cmd-trigger:hover {
      border-color: var(--border-3);
      background: var(--surface-2);
    }
    .local-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .local-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--benign);
      box-shadow: 0 0 8px var(--benign);
    }
    .shell {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 216px;
      flex-shrink: 0;
      border-right: 1px solid var(--divider);
      background: var(--sidebar);
      padding: 16px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .sidebar.hidden { display: none; }
    .nav-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: 600;
      padding: 0 8px 8px;
      display: flex;
      justify-content: space-between;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      height: 34px;
      padding: 0 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius);
      transition: 0.12s;
      color: var(--text-muted);
      text-align: left;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active {
      background: var(--surface-3);
      color: var(--text-hi);
    }
    .case-nav {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 8px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: var(--radius);
      transition: 0.12s;
      text-align: left;
      color: inherit;
    }
    .case-nav:hover, .case-nav.active { background: var(--surface-2); }
    .case-nav-name {
      display: block;
      font-size: 12.5px;
      color: var(--text-2);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .case-nav-meta {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
    }
    .main {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }
    .screen {
      display: none;
      padding: 28px 32px;
      max-width: 1280px;
      animation: fadeIn 0.2s ease;
    }
    .screen.active { display: block; }
    .screen-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 22px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .screen-head h1 {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-hi);
      margin: 0;
    }
    .screen-head p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 3px 0 0;
    }
    .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 900px) {
      .body-grid, .extract-grid, .case-grid, .pb-grid { grid-template-columns: 1fr !important; }
      .metrics-rail { flex-wrap: wrap; height: auto; }
    }
    .metrics-rail {
      display: flex;
      align-items: center;
      gap: 18px;
      height: 46px;
      padding: 0 16px;
      margin-bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
    }
    .metric {
      display: flex;
      align-items: baseline;
      gap: 7px;
      white-space: nowrap;
    }
    .metric-value {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 600;
    }
    .metric-label {
      font-size: 11px;
      color: var(--text-dim);
    }
    .metric-divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }
    .metrics-session {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .body-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 20px;
      align-items: start;
    }
    .rail-title {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: 600;
    }
    .rail-row {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid var(--divider-faint);
      padding: 10px 14px;
      color: inherit;
      transition: 0.12s;
    }
    .rail-row:last-child { border-bottom: none; }
    .rail-row:hover { background: var(--surface-2); }
    .rail-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .rail-row-value {
      flex: 1;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rail-row-meta {
      font-size: 10.5px;
      color: var(--text-dim);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rail-empty {
      padding: 12px 14px;
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--divider);
    }
    .panel-title { font-size: 13px; font-weight: 600; color: var(--text-hi); }
    .panel-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }
    .col-head {
      display: grid;
      grid-template-columns: minmax(200px, 1.5fr) minmax(140px, 1fr) 96px 74px 64px;
      gap: 10px;
      padding: 9px 18px;
      border-bottom: 1px solid var(--divider);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: 600;
    }
    .triage-row {
      display: grid;
      grid-template-columns: minmax(200px, 1.5fr) minmax(140px, 1fr) 96px 74px 64px;
      gap: 10px;
      align-items: center;
      padding: 11px 18px;
      border-bottom: 1px solid var(--divider-faint);
      border-left: 2px solid transparent;
      transition: 0.12s;
    }
    .inbox-row.pivoting {
      background: var(--surface-2);
      border-left-color: var(--accent);
    }
    .triage-enrich {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .triage-seen {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .triage-actions {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }
    .labs-banner {
      padding: 10px 14px;
      margin-bottom: 12px;
      background: rgba(217, 161, 91, 0.1);
      border: 1px solid rgba(217, 161, 91, 0.35);
      border-radius: var(--radius);
      color: var(--email);
      font-size: 12px;
      line-height: 1.4;
    }
    .copy-as-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .triage-row:hover { background: var(--surface-2); }
    .ioc-cell {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .ioc-val {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ioc-meta {
      font-size: 10.5px;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      border-radius: 5px;
      color: var(--text-muted);
      font-size: 12px;
      transition: 0.12s;
    }
    .icon-btn:hover {
      background: #1e242f;
      color: var(--accent);
    }
    .case-row {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      border: none;
      border-bottom: 1px solid var(--divider-faint);
      background: none;
      color: inherit;
      transition: 0.12s;
    }
    .case-row:hover { background: var(--surface-2); }
    .case-row-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .extract-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    textarea.raw {
      width: 100%;
      height: 320px;
      background: var(--inset);
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 12px;
      resize: vertical;
      outline: none;
    }
    textarea.raw:focus { border-color: var(--accent); }
    .panel-foot {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--divider);
      flex-wrap: wrap;
    }
    .extract-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--divider-faint);
    }
    .extract-row input { accent-color: var(--accent); }
    .pb-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .set-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      align-items: start;
    }
    .set-body { padding: 14px 18px 16px; }
    .set-hint {
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      font-size: 12.5px;
      color: var(--text-2);
      border-bottom: 1px solid var(--divider-faint);
    }
    .set-row:last-child { border-bottom: none; }
    .set-row-value {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .set-services {
      max-height: 320px;
      overflow-y: auto;
    }
    .set-add {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .set-add input {
      flex: 1;
      min-width: 0;
      height: 30px;
      background: var(--inset);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-sm);
      color: var(--text-hi);
      font-size: 12px;
      padding: 0 8px;
    }
    .set-add input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .set-empty {
      font-size: 12px;
      color: var(--text-dim);
      padding: 4px 0;
    }
    .toggle {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: var(--border-2);
      border: none;
      position: relative;
      transition: 0.15s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      transition: 0.15s;
    }
    .toggle.on::after { left: 19px; }
    .pb-defaults { margin-bottom: 16px; }
    .pb-default-rows {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 8px 18px;
      padding: 12px 18px 14px;
    }
    .pb-default-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pb-default-type {
      width: 96px;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .pb-default-select {
      flex: 1;
      min-width: 0;
      height: 30px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 12px;
      padding: 0 8px;
    }
    .pb-default-empty {
      padding: 12px 18px 14px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .pb-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pb-chain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .pb-chip {
      font-family: var(--font-mono);
      padding: 4px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      border-radius: 4px;
      color: var(--text-2);
    }
    .pb-prompt {
      border-left: 2px solid var(--accent);
      padding: 8px 10px;
      background: var(--inset);
      font-size: 12px;
      color: var(--text-muted);
    }
    .case-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      align-items: start;
    }
    .timeline {
      position: relative;
      padding: 8px 0 8px 18px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 3px;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: var(--border);
    }
    .tl-item {
      position: relative;
      padding: 0 0 16px 14px;
    }
    .tl-dot {
      position: absolute;
      left: -18px;
      top: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .tl-time {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    .tl-text { font-size: 12.5px; color: var(--text-2); }
    .notes-box {
      margin-top: 16px;
      padding: 14px;
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 100px;
    }
    .notes-box textarea {
      width: 100%;
      min-height: 80px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      resize: vertical;
      outline: none;
    }
    .modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 10, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 900;
    }
    .modal-scrim.open { display: flex; }
    .modal {
      width: 420px;
      max-width: 92vw;
      background: var(--top-bar);
      border: 1px solid var(--border-3);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-float);
    }
    .modal h2 {
      margin: 0 0 14px;
      font-size: 16px;
      color: var(--text-hi);
    }
    .modal label {
      display: block;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 10px 0 6px;
    }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      background: var(--inset);
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      color: var(--text);
      outline: none;
    }
    .modal textarea { height: 80px; padding: 10px; }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }
    .back-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 12.5px;
      padding: 0;
      margin-bottom: 10px;
    }
    .inbox-toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--divider);
      align-items: center;
      flex-wrap: wrap;
    }
    .inbox-search {
      flex: 1;
      min-width: 160px;
      height: 30px;
      padding: 0 10px;
      background: var(--inset);
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      outline: none;
    }
    .inbox-search:focus { border-color: var(--accent); }
    .inbox-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--divider);
    }
    .inbox-tags-menu-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .inbox-tags-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 20;
      width: 240px;
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
      background: var(--top-bar);
      border: 1px solid var(--border-3);
      border-radius: var(--radius);
      box-shadow: var(--shadow-float);
      animation: fadeUp 0.12s ease;
    }
    .inbox-tags-menu[hidden] { display: none; }
    .inbox-menu-label {
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: 600;
      padding: 6px 8px 4px;
    }
    .inbox-menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-2);
      font-size: 12px;
      text-align: left;
    }
    .inbox-menu-item:hover { background: var(--surface-3); }
    .inbox-menu-item.active { color: var(--accent); }
    .inbox-menu-item .count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-dim);
    }
    .inbox-tag-chip {
      height: 24px;
      padding: 0 10px;
      border: 1px solid var(--border-2);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      transition: 0.12s;
    }
    .inbox-tag-chip:hover,
    .inbox-tag-chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(97, 175, 239, 0.1);
    }
    .inbox-row:hover { background: var(--surface-2); }
    .case-ioc-block {
      border-bottom: 1px solid var(--divider-faint);
      padding-bottom: 10px;
    }
    .case-ioc-notes-label {
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: 600;
      padding: 6px 14px 4px;
    }
    .case-ioc-notes {
      width: calc(100% - 28px);
      min-height: 52px;
      margin: 0 14px 8px;
      padding: 8px 10px;
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 12px;
      resize: vertical;
      outline: none;
    }
    .case-ioc-notes:focus { border-color: var(--accent); }
    .modal.modal-wide { width: 520px; }
  </style>
</head>
<body class="aperture">
  <header class="topbar">
    <div class="topbar-brand">
      <img class="ap-brand-icon" src="icons/icon128.png" width="22" height="22" alt="">
      <div class="ap-wordmark">
        <span class="ap-wordmark-title">APERTURE</span>
        <span class="ap-wordmark-sub">osint workbench</span>
      </div>
    </div>
